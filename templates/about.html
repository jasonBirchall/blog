{% extends "base.html" %}
{% block title %}About &middot; {{ site_name }}{% endblock %}
{% block content %}
<article>
  <header class="post-header">
    <h1>{{ post.title }}</h1>
  </header>
  <div class="post-body">
    {# body_html is nh3-sanitised upstream at sync time, as in post_detail. #}
    {{ post.body_html|safe }}
  </div>
  {% include "partials/contact_card.html" %}
</article>
{% endblock %}
